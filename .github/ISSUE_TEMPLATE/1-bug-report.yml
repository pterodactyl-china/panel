name: 缺陷报告
description: 用于反馈软件中已知且可复现的问题。
body:
  - type: markdown
    attributes:
      value: |
        缺陷报告仅用于反馈软件运行中的问题。安装协助、依赖调试等请前往我们的 [Discord 服务器](https://discord.gg/pterodactyl)。

  - type: textarea
    attributes:
      label: 当前表现
      description: 请清晰、简洁地描述该问题。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期表现
      description: 请描述您期望发生的结果。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      description: 请尽可能详细地提供复现步骤，未提供步骤的反馈将被关闭。
    validations:
      required: true

  - type: input
    id: panel-version
    attributes:
      label: 面板版本
      description: 您所使用的面板版本号（填写「最新版」无效）
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: wings-version
    attributes:
      label: Wings 版本
      description: 您所使用的 Wings 版本号（填写「最新版」无效）
      placeholder: 1.4.2
    validations:
      required: true

  - type: input
    id: egg-details
    attributes:
      label: 受影响的游戏/预设
      description: 请注明触发该缺陷的具体游戏或预设。
      placeholder: Minecraft (Paper), Minecraft (Forge)

  - type: input
    id: docker-image
    attributes:
      label: Docker 镜像
      description: 上述游戏所使用的具体 Docker 镜像。
      placeholder: ghcr.io/pterodactyl/yolks:java_17

  - type: textarea
    id: panel-logs
    attributes:
      label: 错误日志
      description: |
        在您的系统上执行以下命令以收集日志。

        Wings：`sudo wings diagnostics`
        面板：`tail -n 150 /var/www/pterodactyl/storage/logs/laravel-$(date +%F).log | nc pteropaste.com 99`
      placeholder: "https://pteropaste.com/a1h6z"
      render: bash
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: 是否已存在相同的问题？
      description: 请先[在此搜索](https://github.com/pterodactyl-china/panel/issues)，确认该问题是否已被反馈。
      options:
        - label: 我已在提交前搜索过现有问题。我理解若提供的信息不足，维护者可能在不另行通知的情况下关闭此问题。
          required: true
